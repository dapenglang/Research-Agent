# Unified LLM Configuration
# Phase 4: Dual-model strategy — deepseek-r1:8b (reasoning) + gemma4:26b (auxiliary)
# Both served locally via Ollama, no API key needed

provider: ollama_r1

# Provider configurations
providers:
  deepseek:
    api_key: ${DEEPSEEK_API_KEY}
    model: deepseek-reasoner
    endpoint: https://api.deepseek.com/v1
    temperature: 0.3
    max_tokens: 8192

  openai:
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o
    endpoint: https://api.openai.com/v1
    temperature: 0.3
    max_tokens: 4096

  ollama_r1:
    api_key: "ollama"
    model: deepseek-r1:8b
    endpoint: http://localhost:11434/v1
    model_path: "E:/ollama/models"
    temperature: 0.3
    max_tokens: 8192
    timeout: 300

  ollama:
    api_key: "ollama"
    model: gemma4:26b
    endpoint: http://localhost:11434/v1
    model_path: "E:/ollama/models"
    temperature: 0.3
    max_tokens: 8192
    timeout: 300

# Task-specific routing — dual model strategy
# deepseek-r1:8b (supports thinking) → core reasoning tasks
# gemma4:26b (larger, better text generation) → auxiliary tasks
task_routing:
  # Core reasoning → deepseek-r1:8b
  literature_analysis:
    provider: ollama_r1
    model: deepseek-r1:8b
    temperature: 0.2
    max_tokens: 8192
    timeout: 300
  innovation_reasoning:
    provider: ollama_r1
    model: deepseek-r1:8b
    temperature: 0.5
    max_tokens: 8192
    timeout: 300
  method_design:
    provider: ollama_r1
    model: deepseek-r1:8b
    temperature: 0.3
    max_tokens: 8192
    timeout: 300
  experiment_analysis:
    provider: ollama_r1
    model: deepseek-r1:8b
    temperature: 0.2
    max_tokens: 8192
    timeout: 300
  reviewer:
    provider: ollama_r1
    model: deepseek-r1:8b
    temperature: 0.2
    max_tokens: 8192
    timeout: 300
  # Auxiliary → gemma4:26b
  paper_generation:
    provider: ollama
    model: gemma4:26b
    temperature: 0.7
    max_tokens: 8192
    timeout: 300
  figure_generation:
    provider: ollama
    model: gemma4:26b
    temperature: 0.3
    max_tokens: 4096
    timeout: 300
  reference_checking:
    provider: ollama
    model: gemma4:26b
    temperature: 0.1
    max_tokens: 4096
    timeout: 300

# Fallback behavior when LLM is unavailable
# Phase 4: Fallback managed centrally by configs/dependency_policy.yaml
# LLM failure → human_intervention (NOT template, NOT mock)
fallback:
  policy_ref: "llm_fallback"
  mode: human_intervention
  message: "LLM not configured, pipeline paused for human intervention"
