# LLM Routing Configuration — dual-model task routing
# deepseek-r1:8b (ollama_r1): core reasoning tasks (thinking model)
# gemma4:26b (ollama): auxiliary tasks (larger, better at text generation)

routing:
  # Core reasoning tasks → deepseek-r1:8b (supports thinking)
  literature_analysis:
    provider: "ollama_r1"
    model: "deepseek-r1:8b"
    temperature: 0.2
    max_tokens: 8192
    timeout: 300

  innovation_reasoning:
    provider: "ollama_r1"
    model: "deepseek-r1:8b"
    temperature: 0.5
    max_tokens: 8192
    timeout: 300

  method_design:
    provider: "ollama_r1"
    model: "deepseek-r1:8b"
    temperature: 0.3
    max_tokens: 8192
    timeout: 300

  experiment_analysis:
    provider: "ollama_r1"
    model: "deepseek-r1:8b"
    temperature: 0.2
    max_tokens: 8192
    timeout: 300

  reviewer:
    provider: "ollama_r1"
    model: "deepseek-r1:8b"
    temperature: 0.2
    max_tokens: 8192
    timeout: 300

  # Auxiliary tasks → gemma4:26b (larger, better at text generation)
  paper_generation:
    provider: "ollama"
    model: "gemma4:26b"
    temperature: 0.7
    max_tokens: 8192
    timeout: 300

  figure_generation:
    provider: "ollama"
    model: "gemma4:26b"
    temperature: 0.3
    max_tokens: 4096
    timeout: 300

  reference_checking:
    provider: "ollama"
    model: "gemma4:26b"
    temperature: 0.1
    max_tokens: 4096
    timeout: 300

# Default fallback when a task type is not listed above
default:
  provider: "ollama_r1"
  model: "deepseek-r1:8b"
  temperature: 0.3
  max_tokens: 8192
  timeout: 300
