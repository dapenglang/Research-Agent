# Environment Specification
# v8.2.2 Unified environment requirements

python:
  version: "3.12"
  min_version: "3.10"

conda:
  environment: "research_agent_v3"

system:
  os: "windows"  # windows | linux
  min_ram_gb: 8
  min_disk_gb: 10

gpu:
  required: false
  min_vram_gb: 4

pip_dependencies:
  - pyyaml>=6.0
  - requests>=2.28
  - numpy>=1.24
  - pandas>=2.0
  - openpyxl>=3.1
  - scipy>=1.10
  - matplotlib>=3.7
  - seaborn>=0.12

optional_pip:
  - torch>=2.0
  - transformers>=4.30
  - arxiv>=2.0
  - scholarly>=1.7
