name: research_agent_v3
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pytorch::pytorch>=2.1.0
  - pytorch::torchvision>=0.16.0
  - pytorch::torchaudio>=2.1.0
  - pytorch::pytorch-cuda=12.1
  - numpy>=1.24.0
  - scipy>=1.10.0
  - pandas>=2.0.0
  - matplotlib>=3.7.0
  - pyyaml>=6.0
  - pip:
    - transformers>=4.36.0
    - accelerate>=0.25.0
    - safetensors>=0.4.0
    - tokenizers>=0.15.0
    - sentencepiece>=0.1.99
    - openai>=1.6.0
    - python-docx>=1.1.0
    - openpyxl>=3.1.0
    - markdownify>=0.11.0
    - beautifulsoup4>=4.12.0
    - lxml>=4.9.0
    - requests>=2.31.0
    - tqdm>=4.65.0
    - scikit-learn>=1.3.0
    - Pillow>=10.0.0
prefix: ${CONDA_PREFIX}
