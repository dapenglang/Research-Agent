task_id: "task_001_vlm_safety"
title: "Vision-Language Model Security Research"

research:
  domain: "computer_vision"
  topic: "Adversarial Robustness of Vision-Language Models"
  keywords:
    - "adversarial attack"
    - "vision-language model"
    - "robustness"
    - "safety alignment"
  research_question: "How do adversarial patches affect VLM reasoning capabilities and how can we defend against them?"
  target: "LLaVA-1.5-7B"

literature:
  candidate_target: []
  core_target: []
  deep_analysis_target: []
  arxiv:
    download_pdf: true
    download_source: true
    prefer_latex_analysis: true

llm:
  type: "deepseek"
  model: "deepseek-chat"

experiment:
  mode: "synthetic_research"
  method: "samra"
  synthetic:
    num_samples: 100
    seed: 42
  real:
    checkpoint_dir: "checkpoints"
    resume_from_checkpoint: false
    seed: 42

analysis:
  output_dir: "output/analysis"
  significance_level: 0.05

output:
  figure_table_dir: "output/figures_tables"
  paper_dir: "output/paper"
  reference_dir: "output/references"

paper:
  min_references: 30
